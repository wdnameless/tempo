[package]
name = "tempo"
version = "0.18.3"
description = "Tempo backend: alarm scheduler, countdown timer, alarm audio and AI gateway"
authors = ["Tempo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The bin is a thin shell over tempo_lib::run() with no tests; disabling test avoids duplicate MANIFEST collision alongside tauri resource
[[bin]]
name = "tempo"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for `.transparent(true)`, which the mini
# overlay and the main window both use. Without it the call does not exist on
# macOS and the build fails there while succeeding on Windows and Linux.
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "macos-private-api"] }
# Microphone capture. Pinned to the version rodio already links: two cpal
# versions in one graph collide on the alsa `links` key, and that is checked
# even on Windows where alsa is never built.
cpal = "0.15.3"
# WAV writing: recordings are files on disk, and a hand-rolled RIFF header is
# one place where being clever buys nothing.
hound = "3.5"
# Local speech-to-text: transcribe.cpp is the engine the reference uses, and it
# is whisper.cpp-compatible without pulling the whole whisper-rs tree.
transcribe-cpp = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local wall-clock time for the scheduler. The previous hand-rolled offset maths
# reported UTC outside Windows, so every alarm was shifted by the timezone.
chrono = "0.4"
msedge-tts = "0.4"
base64 = "0.22"
tauri-plugin-store = "2.4.4"
tokio = "1.53.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac", "wav", "mp3", "flac"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream", "multipart"] }
futures-util = { version = "0.3", default-features = false }
# Model downloads carry a sha256 in the catalog; the downloader refuses to hand
# a model to the engine unless the bytes hash to it. Mirrors are untrusted
# bit-pipes, so the hash is the only thing that makes them safe to use at all.
sha2 = "0.10"
# Voice activity detection that is not just an energy threshold. Handy ships
# earshot as its pure-Rust backend; Silero would drag ONNX Runtime into the
# installer, which is not worth ~100 MB for a gate on a 16 kHz stream.
earshot = "1.2.2"

[target.'cfg(windows)'.dependencies]
# System sound is a render device read backwards, and cpal exposes no loopback.
wasapi = "0.24"
# Windows Graphics Capture: a chosen monitor or a chosen window, with the H.264
# encoder that ships alongside it. The webview's getDisplayMedia alternative
# would push every frame of video through the IPC.
windows-capture = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rustls = { version = "0.23", default-features = false, features = ["log", "logging", "ring", "std", "tls12"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
minisign-verify = "0.2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Foundation"] }
percent-encoding = "2.3"
[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true

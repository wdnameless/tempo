name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Builds the Windows desktop release and publishes a draft GitHub
# Release with installer plus a portable bundle.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # Build only: publishing is handled once, after every platform has built.
      # `tauri-action` tried to create and then edit the same release from three
      # jobs at once, and against an already-published release it fails with
      # "Resource not accessible by integration" — after a successful build.
      #
      # The signing key is what lets an installed app verify an update came from
      # this project. Without it the build produces no updater artifacts at all.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      # A portable bundle is the built binary plus an empty `portable` marker:
      # the app sees the marker and keeps its data beside itself rather than in
      # the per-user application data directory. No installer, no registry.
      #
      # `zip` is not present on Windows runners, so the archive is written with
      # PowerShell there and with `zip` elsewhere.
      - name: Build portable bundle
        shell: pwsh
        run: |
          $name = "tempo-${{ github.ref_name }}-portable-windows"
          New-Item -ItemType Directory -Force -Path portable/tempo | Out-Null
          Copy-Item "src-tauri/target/release/tempo.exe" "portable/tempo/tempo.exe"
          New-Item -ItemType File -Force -Path portable/tempo/portable | Out-Null
          Compress-Archive -Path portable/tempo -DestinationPath "$name.zip" -Force
          Write-Host "built $name.zip"
          Copy-Item "src-tauri/target/release/tempo.exe" "tempo-portable.exe"
          Write-Host "prepared standalone tempo-portable.exe"

      # Signs the portable archive with the same key the installers use, so a
      # portable build can verify its own update before replacing itself.
      - name: Sign portable bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $name = "tempo-${{ github.ref_name }}-portable-windows"
          bunx tauri signer sign "$name.zip"
          if (-not (Test-Path "$name.zip.sig")) { throw "signing produced no .sig file" }
          Write-Host "signed $name.zip"
          if (Test-Path "tempo-portable.exe") {
            bunx tauri signer sign "tempo-portable.exe"
            Write-Host "signed tempo-portable.exe"
          }

      # Collect every artifact this platform produced, so the publish job has
      # them all in one place.
      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tempo-windows
          path: |
            tempo-${{ github.ref_name }}-portable-windows.zip
            tempo-${{ github.ref_name }}-portable-windows.zip.sig
            tempo-portable.exe
            tempo-portable.exe.sig
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*-setup.exe.sig
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.sig
          if-no-files-found: warn

  # One job owns the release, so three parallel builds cannot race to edit it.
  publish:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # `latest.json` is what the app actually queries: the running build reads
      # it from `releases/latest/download`, so it must live on every release or
      # the update check 404s. Assembled here from the real artifacts and their
      # signatures rather than hand-written.
      - name: Build latest.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'artifacts';
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, '');
          const repo = process.env.GITHUB_REPOSITORY;
          const base = `https://github.com/${repo}/releases/download/${tag}`;

          const files = [];
          (function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          })(root);

          const has = (name) => files.find((f) => path.basename(f) === name);
          const sigOf = (file) => {
            const sig = file && has(path.basename(file) + '.sig');
            return sig ? fs.readFileSync(sig, 'utf8').trim() : '';
          };
          const urlOf = (file) =>
            file ? `${base}/${encodeURIComponent(path.basename(file))}` : '';

          // One entry per platform the updater understands: Windows installer.
          const targets = [
            { key: 'windows-x86_64', match: (f) => /-setup\.exe$/.test(f) },
          ];

          const platforms = {};
          for (const t of targets) {
            const file = files.find((f) => t.match(f) && !f.endsWith('.sig'));
            if (!file) continue;
            platforms[t.key] = { signature: sigOf(file), url: urlOf(file) };
          }

          // Portable archives under their own keys, so a portable build can
          // find its own update without running an installer.
          const portable = {};
          const windowsPortable = has(`tempo-${tag}-portable-windows.zip`);
          if (windowsPortable) {
            portable['windows-x86_64'] = {
              signature: sigOf(windowsPortable),
              url: urlOf(windowsPortable),
            };
          }

          const missing = Object.entries(platforms).filter(([, v]) => !v.signature);
          if (missing.length) {
            throw new Error(`unsigned updater artifacts: ${missing.map(([k]) => k).join(', ')}`);
          }

          const manifest = {
            version,
            notes: `Tempo ${version}`,
            pub_date: new Date().toISOString(),
            platforms,
            portable,
          };

          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          NODE
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
            latest.json
          fail_on_unmatched_files: false

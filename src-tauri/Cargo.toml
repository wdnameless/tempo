[package]
name = "tempo"
version = "0.3.3"
description = "Tempo backend: alarm scheduler, countdown timer, alarm audio and AI gateway"
authors = ["Tempo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for `.transparent(true)`, which the mini
# overlay and the main window both use. Without it the call does not exist on
# macOS and the build fails there while succeeding on Windows and Linux.
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local wall-clock time for the scheduler. The previous hand-rolled offset maths
# reported UTC outside Windows, so every alarm was shifted by the timezone.
chrono = "0.4"
msedge-tts = "0.4"
base64 = "0.22"
tauri-plugin-store = "2.4.4"
tokio = "1.53.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac", "wav", "mp3", "flac"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
futures-util = { version = "0.3", default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rustls = { version = "0.23", default-features = false, features = ["log", "logging", "ring", "std", "tls12"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
minisign-verify = "0.2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
